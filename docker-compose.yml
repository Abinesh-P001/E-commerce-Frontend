version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: dairyfresh_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dairyfresh_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dairyfresh_backend
    restart: always
    environment:
      PORT: 5000
      DATABASE_URL: "mysql://root:root@mysql:3306/dairyfresh_db"
      JWT_SECRET: "dairyfresh_super_secret_jwt_key_9823478923489234"
      FRONTEND_URL: "http://localhost:5173"
    ports:
      - "5000:5000"
    depends_on:
      - mysql

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dairyfresh_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mysql_data:
